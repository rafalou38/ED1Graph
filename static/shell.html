<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Raylib Web App</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: stretch;
        background: #1a1a1a;
        color: #fff;
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      canvas.emscripten {
        border: none;
        background-color: black;

        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .container {
        flex-grow: 1;
        width: 100%;
        position: relative;

        display: flex;
        justify-content: center;
        align-items: start;
      }
      .controls {
        width: 100%;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 10px;
        flex-grow: 0;
        font-size: 1.5em;
        font-weight: bold;
        padding: 0.5em 1em;
        box-sizing: border-box;
      }
      input {
        padding-left: 0.25em;
        font-weight: bold;
        font-size: 1.5em;
        border-radius: 4px;
        border: 1px solid #444;
        flex-grow: 1;
        height: 2em;
        transition: all 300ms ease;
      }
      input.error{
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label for="btn">y' = </label>
      <input
        type="text"
        id="textInput"
        oninput="sendTextToC()"
        value="5*exp(x-10)-y"
        onkeydown="event.stopPropagation()"
        onkeyup="event.stopPropagation()"
      />
    </div>

    <div class="container">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <script type="text/javascript">
     const input = document.getElementById("textInput");

      // When typing inside the input, suppress GLFW from intercepting Backspace
      window.addEventListener("keydown", function(e) {
        if (document.activeElement === input && (e.key === "Backspace" || e.key === "Tab")) {
          // Stop GLFW's window-level listener from ever receiving this event
          e.stopImmediatePropagation();
        }
      }, true); // `true` ensures this runs BEFORE GLFW's capture listener!
    </script>

    <script type="text/javascript">
      // Bind canvas element to Emscripten Module
      var Module = {
        canvas: (function () {
          return document.getElementById("canvas");
        })(),
      };

      function sendTextToC() {
        const text = document.getElementById("textInput").value;

        // ccall syntax: Module.ccall(ident, returnType, argTypes, args)
        if(Module.ccall("set_eq", "int", ["string"], [text])){
          document.getElementById("textInput").classList.add("error");
        }else{
          document.getElementById("textInput").classList.remove("error");
        }
      }
    </script>

    {{{ SCRIPT }}}
  </body>
</html>
